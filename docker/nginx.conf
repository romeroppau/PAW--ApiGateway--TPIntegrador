
worker_processes auto;
pid /tmp/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # No mostrar la versión de nginx en las cabeceras ni en las páginas de error.
    server_tokens off;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    
    server {
        listen 10000;
        server_name _;

        # Backend
        location /api/auth/ {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Validación de rescatistas (Entrega 5)
        location /api/rescatistas {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Notificaciones (Entrega 5): la campana y marcar como leída. /internal/ sigue bloqueado.
        location /api/notificaciones {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Configuración de la veterinaria (Entrega 5): los parámetros que cambia desde su panel.
        location /api/configuracion {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Mis datos (Entrega 5): cada usuario ve y cambia los datos de su cuenta y su contraseña.
        location /api/cuenta {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Clientes (Entrega 5): la veterinaria ve la lista de clientes y la ficha de cada uno.
        location /api/clientes {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Reseñas (Entrega 5): las escriben clientes y rescatistas, las responde la veterinaria; se ven sin sesión.
        location /api/resenas {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location = /api/backend/salud {
            proxy_pass http://127.0.0.1:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Inventario
        location /api/inventario/ {
            # Las imágenes viajan en base64 dentro del JSON: 1 MB de imagen ocupa ~1,4 MB.
            client_max_body_size 2m;
            proxy_pass http://127.0.0.1:9002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /api/tienda/ {
            proxy_pass http://127.0.0.1:9002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Pacientes (también responde /api/pacientes/salud)
        location /api/pacientes/ {
            # Las fotos de las mascotas viajan en base64 dentro del JSON: 1 MB de imagen ocupa ~1,4 MB.
            client_max_body_size 2m;
            proxy_pass http://127.0.0.1:9003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Adopciones (Entrega 5)
        location /api/adopciones {
            # La foto de la publicación viaja en base64 dentro del JSON, igual que en Pacientes.
            client_max_body_size 2m;
            proxy_pass http://127.0.0.1:9004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Reportes (Entrega 5): motor de avisos y reportes
        location /api/reportes/ {
            proxy_pass http://127.0.0.1:9005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # API común
        location /api/gateway/ {
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Los errores que arma nginx también en JSON, como el resto de la API (27/11, devolución del
        # profesor: antes respondía su página HTML). Los 404 de una ruta que no existe dentro de un
        # módulo ya los responde el módulo en JSON (proxy_intercept_errors está apagado: nginx no los toca).
        error_page 413 @demasiado_grande;
        error_page 502 503 504 @sin_servicio;

        location @demasiado_grande {
            default_type "application/json; charset=utf-8";
            return 413 '{"error":"El pedido es demasiado grande"}';
        }

        location @sin_servicio {
            default_type "application/json; charset=utf-8";
            return 502 '{"error":"El servicio no está disponible en este momento. Probá de nuevo en un rato."}';
        }

        # Bloqueo desde la entrada pública: las rutas internas no existen para afuera.
        location /internal/ {
            default_type "application/json; charset=utf-8";
            return 404 '{"error":"Recurso no encontrado"}';
        }

        # Cualquier otra ruta: no existe.
        location / {
            default_type "application/json; charset=utf-8";
            return 404 '{"error":"Recurso no encontrado"}';
        }
    }

}
