
services:
  app:
    build: .
    ports:
      - "10000:10000"
    environment:
      PORT: "10000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: huellavet_test
      BACKEND_DB_USER: ${BACKEND_DB_USER:-backend}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?Configura BACKEND_DB_PASSWORD en .env}
      INVENTARIO_DB_USER: ${INVENTARIO_DB_USER:-inventario}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:?Configura INVENTARIO_DB_PASSWORD en .env}
      DB_SSL_CA: ""
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Configura JWT_PRIVATE_KEY en .env}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Configura JWT_PUBLIC_KEY en .env}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: huellavet_test
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrator:
    build: .
    profiles: ["tools"]
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: huellavet_test
      DB_ADMIN_USER: root
      DB_ADMIN_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      DB_SSL_CA: ""
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?Configura BACKEND_DB_PASSWORD en .env}
      INVENTARIO_DB_PASSWORD: ${INVENTARIO_DB_PASSWORD:?Configura INVENTARIO_DB_PASSWORD en .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "/app/base/migrar.php"]

volumes:
  mysql_data:
