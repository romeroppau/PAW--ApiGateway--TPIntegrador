
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-10000}:10000"
    volumes:
      - ./ca.pem:/app/ca.pem:ro
    environment:
      PORT: "${PORT:-10000}"

      DB_HOST: "${DB_HOST:?Configura DB_HOST en .env}"
      DB_PORT: "${DB_PORT:?Configura DB_PORT en .env}"
      DB_NAME: "${DB_NAME:?Configura DB_NAME en .env}"
      DB_SSL_CA: "${DB_SSL_CA:?Configura DB_SSL_CA en .env}"

      BACKEND_DB_USER: "${BACKEND_DB_USER:?Configura BACKEND_DB_USER en .env}"
      BACKEND_DB_PASSWORD: "${BACKEND_DB_PASSWORD:?Configura BACKEND_DB_PASSWORD en .env}"

      INVENTARIO_DB_USER: "${INVENTARIO_DB_USER:?Configura INVENTARIO_DB_USER en .env}"
      INVENTARIO_DB_PASSWORD: "${INVENTARIO_DB_PASSWORD:?Configura INVENTARIO_DB_PASSWORD en .env}"

      JWT_PRIVATE_KEY: "${JWT_PRIVATE_KEY:?Configura JWT_PRIVATE_KEY en .env}"
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:?Configura JWT_PUBLIC_KEY en .env}"

  db:
    image: mysql:8.0
    profiles: ["local"]
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}"
      MYSQL_DATABASE: "${LOCAL_DB_NAME:-huellavet_test}"
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrator:
    build: .
    profiles: ["tools"]
    volumes:
      - ./ca.pem:/app/ca.pem:ro
    environment:
      DB_HOST: "${DB_HOST:?Configura DB_HOST en .env}"
      DB_PORT: "${DB_PORT:?Configura DB_PORT en .env}"
      DB_NAME: "${DB_NAME:?Configura DB_NAME en .env}"
      DB_SSL_CA: "${DB_SSL_CA:?Configura DB_SSL_CA en .env}"

      DB_ADMIN_USER: "${DB_ADMIN_USER:?Configura DB_ADMIN_USER en .env}"
      DB_ADMIN_PASSWORD: "${DB_ADMIN_PASSWORD:?Configura DB_ADMIN_PASSWORD en .env}"

      BACKEND_DB_PASSWORD: "${BACKEND_DB_PASSWORD:?Configura BACKEND_DB_PASSWORD en .env}"
      INVENTARIO_DB_PASSWORD: "${INVENTARIO_DB_PASSWORD:?Configura INVENTARIO_DB_PASSWORD en .env}"
    command: ["php", "/app/base/migrar.php"]

volumes:
  mysql_data:
