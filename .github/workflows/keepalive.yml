
name: Keepalive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Consultar salud de Backend
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://paw-apigateway-tpintegrador.onrender.com/api/backend/salud

      - name: Consultar salud de Inventario
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://paw-apigateway-tpintegrador.onrender.com/api/inventario/salud
