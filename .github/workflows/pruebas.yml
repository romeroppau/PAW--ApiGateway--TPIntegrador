# Pruebas automáticas del ApiGateway: revisa los archivos y levanta el sistema completo
# (Nginx + módulos + MySQL) con pruebas/integracion.sh.
#
# Corre en cada push a cualquier rama, en cada pull request hacia dev o main y, por lo tanto,
# también después de cada merge (que es un push a dev o a main).
# Las reglas del repo exigen que el chequeo "pruebas" pase para poder mergear a dev y a main.

name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:
    branches: [dev, main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # A main solo se llega desde dev: un pull request de otra rama hacia main falla acá.
      - name: A main solo se mergea desde dev
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref != 'dev'
        env:
          RAMA_ORIGEN: ${{ github.head_ref }}
        run: |
          echo "::error::A main solo se mergea desde dev. Este pull request viene de '$RAMA_ORIGEN': cambiá la base a dev."
          exit 1

      # Trae también los submódulos (Backend, Inventario, Pacientes) en el commit al que apunta esta rama.
      - name: Bajar el código con los submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sintaxis de PHP y de los scripts
        run: |
          find comun base -name '*.php' -print0 | xargs -0 -r -n1 php -l
          sh -n docker/iniciar.sh
          for script in pruebas/*.sh; do bash -n "$script"; done

      # Todo lo que está antes de <?php PHP lo manda como respuesta, y después ya no puede poner
      # el código de estado (un 404 sale como 200 y como HTML).
      - name: Los archivos PHP empiezan con <?php
        run: |
          fallas=0
          while IFS= read -r -d '' archivo; do
            if [ "$(head -c 5 "$archivo")" != "<?php" ]; then
              echo "::error file=$archivo::Tiene algo antes de <?php (una línea en blanco, espacios o BOM)."
              fallas=1
            fi
          done < <(find comun base -name '*.php' -print0)
          exit $fallas

      - name: Prueba de integración (sistema completo en Docker)
        run: bash pruebas/integracion.sh
